name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: |
          npm test
          npm run audit:static
          npm run check:source
          npm run check:offplan
          node scripts/check-design-review.mjs
          node scripts/check-northline-v5.mjs
          node scripts/check-developer-motion-review.mjs
      - name: Build
        env:
          GITHUB_PAGES: 'true'
          PUBLIC_INDEX_SITE: 'false'
          PUBLIC_ANALYTICS_ENABLED: 'false'
        run: npm run build:all
      - name: Assemble
        run: node scripts/assemble-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
