name: portfolio-quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Structural self-audit
        run: npm run audit:static
      - name: Check shared TypeScript sources
        run: npm run check:source
      - name: Astro and TypeScript checks
        run: npm run check:offplan
      - name: Build first validated site
        run: npm run build:offplan
      - name: Build scaffold compatibility
        run: |
          npm run build --workspace @estate/investor-advisory
          npm run build --workspace @estate/luxury-brokerage
          npm run build --workspace @estate/seller-leads
          npm run build --workspace @estate/developer-project
      - name: Upload first site static output
        uses: actions/upload-artifact@v4
        with:
          name: dubai-offplan-dist
          path: apps/dubai-offplan/dist
